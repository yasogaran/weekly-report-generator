server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/weekly_reports?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: $pwd=Mysql5      
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Custom application properties (read via @ConfigurationProperties or @Value)
app:
  jwt:
    secret: change-this-to-a-long-random-secret-before-real-use-1234567890
    expiration-ms: 86400000   # 24 hours
  cors:
    allowed-origin: http://localhost:3000   # the Next.js dev server; override for a deployed frontend
